<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Classic Network Computers Connected (Tunneling) -->
  <!-- Top Right Monitor -->
  <rect x="9" y="1" width="9" height="7" rx="1" fill="#E8E4D8" stroke="#000000" stroke-width="0.8"/>
  <rect x="10" y="2" width="7" height="5" fill="#000080"/>
  <line x1="13" y1="8" x2="13" y2="10" stroke="#000000" stroke-width="0.8"/>
  <line x1="11" y1="10" x2="16" y2="10" stroke="#000000" stroke-width="0.8"/>
  
  <!-- Bottom Left Monitor -->
  <rect x="1" y="9" width="9" height="7" rx="1" fill="#E8E4D8" stroke="#000000" stroke-width="0.8"/>
  <rect x="2" y="10" width="7" height="5" fill="#000080"/>
  <line x1="5" y1="16" x2="5" y2="18" stroke="#000000" stroke-width="0.8"/>
  <line x1="3" y1="18" x2="8" y2="18" stroke="#000000" stroke-width="0.8"/>

  <!-- Network Connecting Bus Lines (Green & Orange) -->
  <path d="M5 16 L5 13 L13 13 L13 9" fill="none" stroke="#008000" stroke-width="1.5"/>
  <!-- Glowing Data Packets -->
  <rect x="8" y="12" width="3" height="3" fill="#FFFF00" stroke="#000000" stroke-width="0.5"/>
</svg>
