<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Classic Desktop Printer -->
  <!-- Top Paper -->
  <rect x="5" y="1" width="10" height="6" fill="#FFFFFF" stroke="#000" stroke-width="0.8"/>
  <line x1="7" y1="3" x2="13" y2="3" stroke="#888" stroke-width="0.8"/>
  <!-- Printer Body -->
  <rect x="2" y="6" width="16" height="8" rx="1" fill="#D4D0C8" stroke="#000" stroke-width="1"/>
  <rect x="4" y="9" width="12" height="2" fill="#333"/>
  <!-- Output Paper -->
  <rect x="5" y="11" width="10" height="7" fill="#FFFFFF" stroke="#000" stroke-width="0.8"/>
  <line x1="7" y1="13" x2="13" y2="13" stroke="#333" stroke-width="0.8"/>
  <line x1="7" y1="15" x2="11" y2="15" stroke="#333" stroke-width="0.8"/>
  <circle cx="15" cy="8" r="0.8" fill="#00FF00"/>
</svg>
