<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Classic CRT Terminal Monitor -->
  <!-- Outer beige casing -->
  <rect x="2" y="2" width="16" height="12" rx="1.5" fill="#E8E4D8" stroke="#000000" stroke-width="1"/>
  <!-- Bezel inner shadow -->
  <rect x="3" y="3" width="14" height="10" fill="#D0CCC0"/>
  <!-- Black CRT screen glass -->
  <rect x="4" y="4" width="12" height="8" rx="1" fill="#000000"/>
  <!-- Glowing green terminal prompt & text -->
  <rect x="5" y="5" width="2" height="2" fill="#00FF00"/>
  <rect x="8" y="5" width="6" height="1" fill="#00FF00"/>
  <rect x="5" y="8" width="4" height="1" fill="#00FF00"/>
  <rect x="10" y="8" width="2" height="2" fill="#00FF00"/>
  <!-- Stand neck and base -->
  <rect x="8" y="14" width="4" height="2" fill="#B0ACA0" stroke="#000000" stroke-width="0.8"/>
  <path d="M4 16 L16 16 L17 18 L3 18 Z" fill="#D0CCC0" stroke="#000000" stroke-width="0.8"/>
  <!-- Power LED indicator -->
  <circle cx="15" cy="13" r="0.7" fill="#00FF00"/>
</svg>
