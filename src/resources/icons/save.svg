<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Classic Win32 3.5" Diskette -->
  <path d="M2 2 L14 2 L17 5 L17 18 L2 18 Z" fill="#000080" stroke="#000000" stroke-width="1"/>
  <!-- Silver sliding shutter with notch -->
  <rect x="5" y="2" width="7" height="6" fill="#C0C0C0" stroke="#000000" stroke-width="0.8"/>
  <rect x="6" y="3" width="2" height="4" fill="#000080"/>
  <!-- White paper label with classic red top stripe -->
  <rect x="4" y="9" width="11" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
  <rect x="5" y="10" width="9" height="2" fill="#D00000"/>
  <line x1="5" y1="13" x2="13" y2="13" stroke="#808080" stroke-width="0.8"/>
  <line x1="5" y1="15" x2="11" y2="15" stroke="#808080" stroke-width="0.8"/>
</svg>
