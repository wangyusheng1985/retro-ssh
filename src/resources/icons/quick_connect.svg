<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Classic Quick Connect: Terminal Monitor with Blue Lightning Bolt -->
  <!-- Beige Monitor -->
  <rect x="2" y="3" width="14" height="11" rx="1" fill="#E8E4D8" stroke="#000000" stroke-width="0.8"/>
  <rect x="3" y="4" width="12" height="9" fill="#000080"/>
  <!-- Monitor base -->
  <rect x="7" y="14" width="4" height="2" fill="#808080" stroke="#000000" stroke-width="0.5"/>
  <line x1="4" y1="16" x2="14" y2="16" stroke="#000000" stroke-width="1"/>

  <!-- High-voltage Electric Lightning Bolt (Blue with Yellow glow) -->
  <polygon points="13,1 8,9 12,9 9,18 18,7 13,7" fill="#00C8FF" stroke="#000080" stroke-width="0.8"/>
</svg>
