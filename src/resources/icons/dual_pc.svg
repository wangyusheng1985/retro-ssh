<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 32" width="36" height="32">
  <!-- Classic Dual PC Network Icon -->
  <!-- Left PC (Back) -->
  <rect x="2" y="2" width="16" height="13" rx="1" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
  <rect x="4" y="4" width="12" height="9" fill="#0000A0"/>
  <rect x="7" y="15" width="6" height="3" fill="#808080"/>
  <rect x="4" y="18" width="12" height="2" fill="#C0C0C0" stroke="#000000" stroke-width="0.8"/>
  <circle cx="6" cy="19" r="0.6" fill="#00FF00"/>
  
  <!-- Right PC (Front) -->
  <rect x="12" y="8" width="16" height="13" rx="1" fill="#D4D0C8" stroke="#000000" stroke-width="1.2"/>
  <rect x="14" y="10" width="12" height="9" fill="#0055EA"/>
  <rect x="17" y="21" width="6" height="3" fill="#808080"/>
  <rect x="14" y="24" width="12" height="2" fill="#D4D0C8" stroke="#000000" stroke-width="0.8"/>
  <circle cx="16" cy="25" r="0.6" fill="#00FF00"/>
  
  <!-- Connecting Cable / Hub -->
  <path d="M8 20 L8 28 L20 28 L20 26" fill="none" stroke="#FFFF00" stroke-width="1.5"/>
</svg>
