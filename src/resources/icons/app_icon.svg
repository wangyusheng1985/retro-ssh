<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDEDED"/>
      <stop offset="50%" stop-color="#D6D6D6"/>
      <stop offset="100%" stop-color="#B8B8B8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051008"/>
      <stop offset="100%" stop-color="#0F2414"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D0D0D0"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
  </defs>

  <!-- CRT Monitor Outer Casing -->
  <rect x="4" y="4" width="56" height="44" rx="4" fill="url(#bezelGrad)" stroke="#4A4A4A" stroke-width="1.5"/>
  <!-- Highlight on top edge -->
  <line x1="6" y1="5.5" x2="58" y2="5.5" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Screen Bezel (Sunken Frame) -->
  <rect x="9" y="8" width="46" height="34" rx="3" fill="#202020" stroke="#808080" stroke-width="1"/>
  <!-- Inner CRT Screen -->
  <rect x="11" y="10" width="42" height="30" rx="2" fill="url(#screenGrad)"/>

  <!-- Phosphor Green Prompt '>_' -->
  <path d="M15 17 L21 21 L15 25" stroke="#33FF33" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="23" width="7" height="2.5" fill="#33FF33"/>

  <!-- Power LED Indicator -->
  <circle cx="51" cy="44" r="1.5" fill="#00FF66"/>

  <!-- Stand / Base Neck -->
  <rect x="25" y="48" width="14" height="5" fill="url(#baseGrad)" stroke="#505050" stroke-width="1"/>
  <!-- Base Plate (Slanted 3D) -->
  <polygon points="14,58 50,58 46,53 18,53" fill="url(#bezelGrad)" stroke="#4A4A4A" stroke-width="1"/>
  <line x1="15" y1="57.5" x2="49" y2="57.5" stroke="#FFFFFF" stroke-width="0.8"/>
</svg>
