<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Classic Settings Spiral Binder Notebook with Gear/Wrench -->
  <!-- Burgundy/Red Hardcover Spine -->
  <rect x="2" y="2" width="15" height="16" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
  <rect x="2" y="2" width="3" height="16" fill="#800000"/>
  <!-- Silver Wire Spiral Rings -->
  <ellipse cx="3.5" cy="5" rx="1.5" ry="0.8" fill="#D4D0C8" stroke="#000000" stroke-width="0.5"/>
  <ellipse cx="3.5" cy="8" rx="1.5" ry="0.8" fill="#D4D0C8" stroke="#000000" stroke-width="0.5"/>
  <ellipse cx="3.5" cy="11" rx="1.5" ry="0.8" fill="#D4D0C8" stroke="#000000" stroke-width="0.5"/>
  <ellipse cx="3.5" cy="14" rx="1.5" ry="0.8" fill="#D4D0C8" stroke="#000000" stroke-width="0.5"/>

  <!-- Golden Brass Gear in Front -->
  <circle cx="12" cy="11" r="4.5" fill="#C89020" stroke="#000000" stroke-width="0.8"/>
  <circle cx="12" cy="11" r="2" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
  <!-- Gear teeth -->
  <path d="M12 5.5 L12 7.5 M12 14.5 L12 16.5 M6.5 11 L8.5 11 M15.5 11 L17.5 11" stroke="#000000" stroke-width="1.2"/>
  <path d="M8 7 L9.5 8.5 M14.5 13.5 L16 15 M8 15 L9.5 13.5 M14.5 8.5 L16 7" stroke="#000000" stroke-width="1.2"/>
</svg>
