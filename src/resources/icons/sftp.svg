<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Classic Folder with Green Transmission Arrow (File Transfer) -->
  <!-- Manila Folder Back -->
  <path d="M2 4 L7 4 L9 6 L17 6 L17 16 L2 16 Z" fill="#D4A017" stroke="#000000" stroke-width="0.8"/>
  <!-- White Paper Inside -->
  <rect x="4" y="5" width="11" height="9" fill="#FFFFFF" stroke="#000000" stroke-width="0.5"/>
  <!-- Manila Folder Front Lip -->
  <polygon points="1,8 18,8 16,16 1,16" fill="#F4C430" stroke="#000000" stroke-width="0.8"/>

  <!-- Upward Green Transfer Arrow with Black Border -->
  <polygon points="12,17 12,12 9,12 14,7 19,12 16,12 16,17" fill="#00C000" stroke="#000000" stroke-width="0.8"/>
</svg>
