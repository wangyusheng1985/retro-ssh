<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Classic Win32 Heavy Black Binoculars (Find) -->
  <!-- Left Barrel -->
  <rect x="2" y="5" width="6" height="10" rx="1.5" fill="#1A1A1A" stroke="#000000" stroke-width="0.8"/>
  <ellipse cx="5" cy="15" rx="3" ry="1.5" fill="#3070D0" stroke="#000000" stroke-width="0.8"/>
  <ellipse cx="5" cy="5" rx="2" ry="1" fill="#404040"/>
  <!-- Right Barrel -->
  <rect x="12" y="5" width="6" height="10" rx="1.5" fill="#1A1A1A" stroke="#000000" stroke-width="0.8"/>
  <ellipse cx="15" cy="15" rx="3" ry="1.5" fill="#3070D0" stroke="#000000" stroke-width="0.8"/>
  <ellipse cx="15" cy="5" rx="2" ry="1" fill="#404040"/>
  <!-- Center Bridge & Knurled Focus Wheel -->
  <rect x="8" y="7" width="4" height="6" fill="#808080" stroke="#000000" stroke-width="0.8"/>
  <rect x="9" y="8" width="2" height="4" fill="#C0C0C0"/>
  <line x1="9" y1="9" x2="11" y2="9" stroke="#000000" stroke-width="0.5"/>
  <line x1="9" y1="11" x2="11" y2="11" stroke="#000000" stroke-width="0.5"/>
</svg>
